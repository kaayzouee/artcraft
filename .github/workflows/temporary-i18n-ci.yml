name: Temporary i18n validation

on:
  # Keep this workflow temporary and limited to the localization branch.
  push:
    branches:
      - feat/vietnamese-localization-foundation
    paths:
      - ".github/workflows/temporary-i18n-ci.yml"
      - "frontend/**"
      - "docs/localization/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-i18n-ci.yml"
      - "frontend/**"
      - "docs/localization/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-localization:
    name: Localization tests and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vietnamese localization tests
        working-directory: frontend/libs/common
        run: npx vitest run --config vite.config.ts src/lib/i18n.spec.ts

      - name: Build ArtCraft frontend
        working-directory: frontend
        run: npx nx run artcraft:build

      - name: Upload temporary frontend build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-frontend-i18n-test-build
          path: frontend/apps/artcraft/dist/
          if-no-files-found: error
          retention-days: 3
